name: Update departures

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-departures

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch departures from Västtrafik
        env:
          VASTTRAFIK_CLIENT_ID: ${{ secrets.VASTTRAFIK_CLIENT_ID }}
          VASTTRAFIK_CLIENT_SECRET: ${{ secrets.VASTTRAFIK_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from avgangstavla import live_source

          fetch = live_source(
              os.environ["VASTTRAFIK_CLIENT_ID"],
              os.environ["VASTTRAFIK_CLIENT_SECRET"],
          )
          departures = fetch()
          Path("departures.json").write_text(
              json.dumps(departures, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Save updated departures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departures.json
          if ! git diff --cached --quiet; then
            git commit -m "Update departure data"
            git push
          fi
