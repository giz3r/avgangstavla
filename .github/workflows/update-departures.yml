name: Update departures

on:
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"

concurrency:
  group: update-departures

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch departures from Västtrafik
        env:
          VASTTRAFIK_CLIENT_ID: ${{ secrets.VASTTRAFIK_CLIENT_ID }}
          VASTTRAFIK_CLIENT_SECRET: ${{ secrets.VASTTRAFIK_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from avgangstavla import live_source

          fetch = live_source(
              os.environ["VASTTRAFIK_CLIENT_ID"],
              os.environ["VASTTRAFIK_CLIENT_SECRET"],
          )
          Path("departures.json").write_text(
              json.dumps(fetch(), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Save updated departures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add departures.json

          if ! git diff --cached --quiet; then
            git commit -m "Update departure data"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Prepare Pages files
        run: |
          mkdir -p _site
          cp index.html departures.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
